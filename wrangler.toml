name = "my-ledger"

# @opennextjs/cloudflare 的构建产物入口（由 `opennextjs-cloudflare build` 生成）
main = ".open-next/worker.js"

compatibility_date = "2026-09-01"
compatibility_flags = [
  # 提供 Node.js API —— @opennextjs/cloudflare 以 Next.js 的 Node.js runtime 运行，必需
  "nodejs_compat",
  # 允许应用内 fetch 公网地址（微信开放平台接口等）
  "global_fetch_strictly_public",
]

# ---------------------------------------------------------------------------
# 静态资源：由 Workers 的 assets 绑定提供，替代原 Pages 的静态托管
# ---------------------------------------------------------------------------
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# ISR / revalidate 回源自引用。当前页面全部静态预渲染、未启用增量缓存
# （见 open-next.config.ts，incrementalCache 使用默认的 dummy），
# 因此该绑定暂未被使用；保留它是为了后续按需开启 ISR 时无需再改配置。
# ---------------------------------------------------------------------------
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "my-ledger"

# ---------------------------------------------------------------------------
# D1 SQLite 绑定。database_id 需替换为 `wrangler d1 create my-ledger-db` 输出的真实 ID。
# 本地开发（next dev + initOpenNextCloudflareForDev）会使用 --local 的
# 本地 SQLite 副本（.wrangler/state/v3/d1），不校验该 ID 的真实性。
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "my-ledger-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 说明：未声明 images 绑定。项目未使用 next/image，适配器在 env.IMAGES 未定义时
# 会跳过图片优化并直接返回原图，因此无需开通 Cloudflare Images。

[vars]
APP_ENV = "production"
# 生产环境必须为 false，否则会开放免鉴权的模拟登录接口
AUTH_DEV_MODE = "false"
WECHAT_OAUTH_SCOPE = "snsapi_login"