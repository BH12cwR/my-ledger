name: Deploy to Cloudflare Workers

# 仅手动触发：在 GitHub 仓库的 Actions 页面选择本工作流并点击 Run workflow。
on:
  workflow_dispatch:

# 同一时间只跑一个部署；不打断进行中的任务，避免 D1 迁移执行到一半被取消。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 质量校验并部署
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 两者都来自仓库 Settings → Secrets and variables → Actions
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Build & deploy
        run: npm run deploy
